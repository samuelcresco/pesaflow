<!DOCTYPE html>
<html>
<head>
  <title>CRESTED SS Investment Club</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      width: 350px;
      text-align: center;
    }
    .login-box h2 {
      color: #1a1a2e;
      margin-bottom: 5px;
    }
    .login-box h3 {
      color: #0f3460;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: #0f3460;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #1a1a2e;
    }
    .error {
      color: red;
      font-size: 14px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>CRESTED SS</h2>
    <h3>INVESTMENT CLUB LTD</h3>
    <p>SACCO Management Platform</p>
    <form id="loginForm">
      <input type="text" id="memberNumber" placeholder="Member Number" required>
      <input type="password" id="password" placeholder="Password" required>
      <div id="error" class="error"></div>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const memberNumber = document.getElementById('memberNumber').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error');

      try {
        const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ memberNumber, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/dashboard.html';
        } else {
          errorDiv.textContent = data.error || 'Login failed';
        }
      } catch (err) {
        errorDiv.textContent = 'Server error. Please try again.';
      }
    });
  </script>
</body>
</html>
